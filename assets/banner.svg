<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#6366f1" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.65; }
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite 3s; transform-origin: 1000px 300px; }
      .card-float { animation: floatSlow 7s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: flowDash 2.5s linear infinite; }
      .stat-pill { animation: badgePulse 5s ease-in-out infinite; transform-origin: center; }
      .hero-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
      .hero-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs (in background) -->
  <circle class="orb-1" cx="180" cy="120" r="160" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="280" r="190" fill="#ec4899" filter="url(#glow)" />
  <circle cx="620" cy="380" r="130" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />

  <!-- Dynamic Automation Pipeline Graphics (Right Side, Subtle & Behind Foregrounds) -->
  <g transform="translate(750, 60)">
    <!-- Node 1: Trigger -->
    <g class="card-float" style="animation-delay: 0s;">
      <rect x="30" y="30" width="150" height="64" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="56" cy="62" r="12" fill="#6366f1" fill-opacity="0.3" />
      <text x="56" y="66" fill="#a5b4fc" font-size="14" text-anchor="middle" font-family="sans-serif">⚡</text>
      <text x="78" y="56" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">User Action</text>
      <text x="78" y="73" fill="#94a3b8" font-size="11" font-family="sans-serif">Signup / Event</text>
    </g>

    <!-- Connecting Path 1 -->
    <path class="flow-line" d="M 180 62 L 230 62 Q 250 62 250 82 L 250 110" fill="none" stroke="#818cf8" stroke-width="2" />

    <!-- Node 2: Logic / Sequence Branch -->
    <g class="card-float" style="animation-delay: -2s;">
      <rect x="175" y="110" width="160" height="64" rx="14" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="201" cy="142" r="12" fill="#8b5cf6" fill-opacity="0.3" />
      <text x="201" y="146" fill="#c084fc" font-size="14" text-anchor="middle" font-family="sans-serif">⚙️</text>
      <text x="223" y="136" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">Campaign Flow</text>
      <text x="223" y="153" fill="#94a3b8" font-size="11" font-family="sans-serif">Smart Segmentation</text>
    </g>

    <!-- Connecting Path 2 -->
    <path class="flow-line" d="M 255 174 L 255 200 Q 255 220 235 220 L 195 220" fill="none" stroke="#ec4899" stroke-width="2" />

    <!-- Node 3: Multi-channel Delivery -->
    <g class="card-float" style="animation-delay: -4s;">
      <rect x="40" y="190" width="160" height="64" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="66" cy="222" r="12" fill="#ec4899" fill-opacity="0.3" />
      <text x="66" y="226" fill="#f472b6" font-size="14" text-anchor="middle" font-family="sans-serif">🚀</text>
      <text x="88" y="216" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">High Deliverability</text>
      <text x="88" y="233" fill="#94a3b8" font-size="11" font-family="sans-serif">100k+ Inboxes/hr</text>
    </g>
  </g>

  <!-- Left / Foreground Content (Always Clean & Visible) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" fill="#c7d2fe" font-size="13" font-weight="600" font-family="sans-serif">CURATED LIST &amp; ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title (Gradient Foreground) -->
    <text class="hero-title" x="0" y="162" fill="url(#primaryGrad)" font-size="46" font-weight="800">
      Email Marketing Automation
    </text>

    <!-- Subtitle / Tagline -->
    <text class="hero-sub" x="0" y="206" fill="#f1f5f9" font-size="20" font-weight="600">
      SaaS Platforms &amp; Open-Source Self-Hosted Engines
    </text>

    <text class="hero-sub" x="0" y="238" fill="#94a3b8" font-size="15">
      Campaign Sequences • Visual MJML Builders • Multi-Provider Delivery • Audience CRM
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 280)">
      <!-- Tag 1 -->
      <g>
        <rect x="0" y="0" width="138" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" fill="#38bdf8" font-size="14" font-weight="600" font-family="sans-serif">📬 SaaS Titans</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="168" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" fill="#a78bfa" font-size="14" font-weight="600" font-family="sans-serif">💻 Self-Hosted OSS</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="160" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" fill="#f472b6" font-size="14" font-weight="600" font-family="sans-serif">⚡ High Throughput</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(502, 0)">
        <rect x="0" y="0" width="160" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" fill="#34d399" font-size="14" font-weight="600" font-family="sans-serif">🛡️ Deliverability</text>
      </g>
    </g>

    <!-- Footer meta badges -->
    <g transform="translate(0, 350)">
      <circle cx="8" cy="8" r="4" fill="#6366f1" />
      <text x="22" y="12" fill="#64748b" font-size="12" font-family="sans-serif">Regularly Updated • Community Maintained • Production Ready</text>
    </g>
  </g>
</svg>
